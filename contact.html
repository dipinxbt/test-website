<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteTrail Nepal - Contact</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>

<body>
  <header>
    <a class="logo" href="index.html">TasteTrail Nepal</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="recipe.html">Recipes</a></li>
        <li><a href="recipe-detail.html">Recipe Detail</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <h1>Contact Us</h1>
      <p>Send us your questions or food stories.</p>
    </section>

    <section>
      <h2>Contact Details</h2>
      <p><b>Phone:</b> +977 1 400 0000</p>
      <p><b>Email:</b> hello@tastetrailnepal.com</p>
      <p><b>Address:</b> Thamel, Kathmandu, Nepal</p>
    </section>

    <section>
      <h2>Contact Form</h2>
      <form action="mailto:hello@tastetrailnepal.com" method="post" enctype="text/plain">
        <!-- Required fields provide simple browser validation without JavaScript. -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <input class="button" type="submit" value="Send Message">
      </form>
    </section>
  </main>

  <footer>
    <p>2026 TasteTrail Nepal</p>
  </footer>
</body>

</html>
